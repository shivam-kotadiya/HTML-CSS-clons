<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          html {
  height: 100%;
  box-sizing: border-box;
}

body {
  padding: 30px;
}

*,
*:before,
*:after {
  box-sizing: inherit;
}

.wrapper {
  background-color: gold;
  border: 3px dashed black;
  padding: 20px;
  height:auto;
  gap: 2%;

}


div {
  border: 3px solid #333;
  background-color: #dfdfdf;
  font-size: 20px;
  gap: 2%;

}

.wrapper {
  display:flex;
  flex-wrap:wrap;
}

.a1, .a2, .a3, .a4 {
  width:99%;
  margin:auto;
  gap: 2%;

} 

.b1, .b2 {
  width:99%;
  margin:auto;
}

.c1 {
  width:99%;
  margin:auto;

}

@media (min-width: 200px) {
  .a1, .a2 {
    width: 100%;
    margin: auto;
    gap: 2%;

  }
}


@media (min-width: 200px) {
    .a1,.a2{
        width: 50%;
        margin: auto;
        gap: 2%;
    }
    
    
}

@media (min-width: 200px) {
    .b1,.b2{
        width: 100%;
        margin: auto;

    }
    
}

@media (min-width:200px) {
    .c1{
        width: 100%;
        margin: auto;

    }

}

    </style>
</head>
<body>
    <div class="wrapper">

  <div class="a1">1</div>
  <div class="a2">2</div>
  <div class="a3">3</div>
  <div class="a4">4</div>

  <div class="b1">5</div>
  <div class="b2">6</div>

  <div class="c1">7</div>
  
</div>
</body>
</html>
