<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>* {
  box-sizing: border-box;
}

.navbar {

  justify-content: space-between;
  align-items: center;

}

.logo {

  font-weight: bold;
  color: #222;

}

.nav-links {
  display: flex;
  list-style: disc;
  padding: 10;
  margin: 20;
  gap: 50px;
 flex-direction: row;
 justify-content: center;
 color: #222;
 list-style: none;
}


.auth-buttons{
  color: rgb(35, 99, 99);
  gap: 20px;
  border-radius: 50%;
 
}

.button {
  padding: 10px 18px;
}


.resources{
    color: aqua;
}
.buttion{

    background-color: aqua;
}


</style>
</head>
<body>

</header>

</html>
